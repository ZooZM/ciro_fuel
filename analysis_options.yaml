# Strict analysis per Constitution Principle I (Strict Typing & No Magic Values).
# `strict-casts` / `strict-inference` / `strict-raw-types` close the gaps `strict`
# mode alone leaves open for implicit-dynamic values crossing module boundaries.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Required when combining freezed + json_serializable (freezed README).
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    prefer_final_locals: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    unnecessary_lambdas: true
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
